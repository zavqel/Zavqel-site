<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel Administrativo — ZAVQEL</title>

  <style>
    :root{
      --bg:#080808;
      --panel:#101010;
      --panel2:#0c0c0c;
      --line:rgba(199,164,91,.22);
      --gold:#c7a45b;
      --gold2:#e0c47a;
      --text:#f1eee7;
      --muted:#8c887f;
      --danger:#b96b6b;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Arial,Helvetica,sans-serif;
    }

    .top{
      border-bottom:1px solid var(--line);
      padding:16px 24px;
      text-align:center;
      font-size:10px;
      letter-spacing:4px;
      color:var(--gold);
      text-transform:uppercase;
    }

    .wrap{
      width:min(1100px,92%);
      margin:60px auto;
    }

    .brand{
      text-align:center;
      margin-bottom:40px;
    }

    .brand small{
      display:block;
      color:var(--gold);
      font-size:10px;
      letter-spacing:4px;
      text-transform:uppercase;
      margin-bottom:12px;
    }

    .brand h1{
      margin:0;
      font-family:Georgia,serif;
      font-size:48px;
      font-weight:400;
    }

    .brand h1 span{
      color:var(--gold2);
      font-style:italic;
    }

    .login-card,
    .admin-panel{
      width:min(620px,100%);
      margin:0 auto;
      background:var(--panel);
      border:1px solid var(--line);
      padding:36px;
    }

    .admin-panel{
      display:none;
      width:100%;
    }

    .login-card h2,
    .admin-panel h2{
      margin:0 0 10px;
      font-family:Georgia,serif;
      font-size:28px;
      font-weight:400;
    }

    .subtitle{
      color:var(--muted);
      font-size:13px;
      line-height:1.6;
      margin-bottom:28px;
    }

    label{
      display:block;
      margin-bottom:8px;
      color:var(--gold);
      font-size:10px;
      letter-spacing:2px;
      text-transform:uppercase;
    }

    input,
    select{
      width:100%;
      height:48px;
      padding:0 14px;
      border:1px solid rgba(255,255,255,.12);
      background:#0b0b0b;
      color:var(--text);
      outline:none;
    }

    input:focus,
    select:focus{
      border-color:var(--gold);
    }

    .field{
      margin-bottom:20px;
    }

    button{
      width:100%;
      height:48px;
      border:0;
      background:var(--gold);
      color:#111;
      font-size:10px;
      letter-spacing:2px;
      font-weight:700;
      cursor:pointer;
    }

    button:hover{
      background:var(--gold2);
    }

    .message{
      display:none;
      margin-top:16px;
      padding:12px 14px;
      border:1px solid rgba(185,107,107,.35);
      color:#d59a9a;
      font-size:13px;
    }

    .panel-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      border-bottom:1px solid var(--line);
      padding-bottom:24px;
      margin-bottom:30px;
    }

    .logout{
      width:auto;
      padding:0 20px;
      background:transparent;
      border:1px solid var(--line);
      color:var(--gold);
    }

    .order-placeholder{
      border:1px solid var(--line);
      padding:24px;
      color:var(--muted);
      text-align:center;
    }

    @media(max-width:700px){
      .wrap{
        margin:35px auto;
      }

      .brand h1{
        font-size:38px;
      }

      .login-card,
      .admin-panel{
        padding:24px;
      }

      .panel-header{
        flex-direction:column;
        align-items:flex-start;
      }

      .logout{
        width:100%;
      }
    }
  </style>
</head>

<body>

  <div class="top">
    ZAVQEL · ÁREA ADMINISTRATIVA
  </div>

  <main class="wrap">

    <div class="brand">
      <small>ZAVQEL · Controle interno</small>

      <h1>
        Painel <span>Administrativo.</span>
      </h1>
    </div>

    <!-- LOGIN -->
    <section class="login-card" id="loginCard">

      <h2>Acesso restrito</h2>

      <div class="subtitle">
        Entre com a senha administrativa para acessar o gerenciamento dos pedidos.
      </div>

      <div class="field">
        <label for="adminPassword">
          Senha administrativa
        </label>

        <input
          type="password"
          id="adminPassword"
          autocomplete="current-password"
          placeholder="Digite sua senha"
        >
      </div>

      <button id="loginButton">
        ENTRAR NO PAINEL
      </button>

      <div class="message" id="loginMessage"></div>

    </section>


    <!-- PAINEL -->
    <section class="admin-panel" id="adminPanel">

      <div class="panel-header">

        <div>
          <h2>Pedidos</h2>

          <div class="subtitle">
            Gerencie status, transportadora e código de rastreio.
          </div>
        </div>

        <button
          class="logout"
          id="logoutButton"
        >
          SAIR
        </button>

      </div>

     <div id="ordersContainer">

  <div class="order-placeholder">
    CARREGANDO PEDIDOS...
  </div>

</div>

    </section>

  </main>

  <script>

    let adminPassword = '';
    
    const loginButton =
      document.getElementById('loginButton');

    const logoutButton =
      document.getElementById('logoutButton');

    const loginCard =
      document.getElementById('loginCard');

    const adminPanel =
      document.getElementById('adminPanel');

    const loginMessage =
      document.getElementById('loginMessage');

   loginButton.addEventListener('click', async () => {

  const password =
    document.getElementById('adminPassword').value;

  loginButton.disabled = true;
  loginButton.textContent = 'AUTENTICANDO...';

  loginMessage.style.display = 'none';

  try {

    const response = await fetch(
      'https://api.zavqel.com.br/admin/login',
      {
        method: 'POST',

        headers: {
          'Content-Type': 'application/json'
        },

        body: JSON.stringify({
          password
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || 'Não foi possível autenticar.'
      );
    }

    adminPassword = password;

    loginCard.style.display = 'none';
    adminPanel.style.display = 'block';
    loadAdminOrders();

  } catch (error) {

    loginMessage.textContent =
      error.message;

    loginMessage.style.display = 'block';

  } finally {

    loginButton.disabled = false;
    loginButton.textContent =
      'ENTRAR NO PAINEL';

  }

});
    async function loadAdminOrders() {

  const ordersContainer =
    document.getElementById('ordersContainer');

  try {

    const response = await fetch(
      'https://api.zavqel.com.br/admin/orders',
      {
        method: 'GET',
        headers: {
          'X-Admin-Password': adminPassword
        }
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || 'Não foi possível carregar os pedidos.'
      );
    }

    if (!data.orders || data.orders.length === 0) {

      ordersContainer.innerHTML = `
        <div class="order-placeholder">
          NENHUM PEDIDO ENCONTRADO.
        </div>
      `;

      return;
    }

    ordersContainer.innerHTML =
      data.orders.map(order => `
        <div class="order-placeholder" style="text-align:left; margin-bottom:20px;">

          <div style="color:#c7a45b; font-size:10px; letter-spacing:2px; margin-bottom:8px;">
            PEDIDO
          </div>

          <div style="font-family:Georgia,serif; font-size:24px; color:#e0c47a; margin-bottom:14px;">
            ${order.order_number}
          </div>

          <div style="color:#f1eee7; margin-bottom:6px;">
            Cliente: ${order.name || '-'}
          </div>

          <div style="color:#8c887f; margin-bottom:6px;">
            E-mail: ${order.email || '-'}
          </div>

          <div style="color:#8c887f; margin-bottom:6px;">
            Valor: R$ ${Number(order.amount).toFixed(2).replace('.', ',')}
          </div>

          <div style="color:#8c887f; margin-bottom:6px;">
            Pagamento: ${order.status || '-'}
          </div>

          <div style="color:#8c887f;">
            Envio: ${order.fulfillment_status || 'pending'}
          </div>

        </div>
      `).join('');

  } catch (error) {

    ordersContainer.innerHTML = `
      <div class="message" style="display:block;">
        ${error.message}
      </div>
    `;

  }
}
    logoutButton.addEventListener('click', () => {

      adminPanel.style.display = 'none';
      loginCard.style.display = 'block';

    });
  </script>

</body>
</html>
