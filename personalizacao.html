<style>
.personalization-request{
  margin-top:95px;
  border:1px solid rgba(199,164,91,.25);
  background:linear-gradient(145deg,#0d0d0d,#070707);
  padding:clamp(28px,5vw,58px);
}
.personalization-request-head{max-width:720px;margin-bottom:38px}
.personalization-request h2{
  font:500 clamp(42px,5vw,68px)/.92 'Cormorant Garamond',serif;
  margin:16px 0 18px;
}
.personalization-request p{
  color:#aaa39a;font-size:14px;line-height:1.9;max-width:650px
}
.zq-form{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.zq-field{display:flex;flex-direction:column;gap:9px}
.zq-field.full{grid-column:1/-1}
.zq-field label{
  color:#c7a45b;font-size:9px;letter-spacing:.2em;text-transform:uppercase
}
.zq-field input,.zq-field textarea{
  width:100%;border:1px solid rgba(238,233,223,.16);
  background:#080808;color:#eee9df;padding:15px 16px;
  font:300 13px Inter,Arial,sans-serif;outline:none;
}
.zq-field textarea{min-height:115px;resize:vertical}
.zq-field input:focus,.zq-field textarea:focus{
  border-color:rgba(199,164,91,.7)
}
.zq-upload{
  border:1px dashed rgba(199,164,91,.45);
  background:#080808;padding:22px;cursor:pointer;
}
.zq-upload input{border:0;padding:0;background:none;cursor:pointer}
.zq-upload small{display:block;color:#777168;margin-top:9px;font-size:11px;line-height:1.6}
.zq-preview{
  display:none;margin-top:14px;padding:10px;border:1px solid rgba(199,164,91,.18);
  background:#050505;
}
.zq-preview img{max-height:150px;max-width:100%;object-fit:contain;margin:auto}
.zq-consent{
  grid-column:1/-1;display:flex;gap:10px;align-items:flex-start;
  color:#777168;font-size:11px;line-height:1.6
}
.zq-consent input{margin-top:3px;accent-color:#c7a45b}
.zq-status{
  grid-column:1/-1;display:none;padding:14px 16px;
  border:1px solid rgba(199,164,91,.3);color:#c7a45b;font-size:12px;line-height:1.6
}
.zq-status.error{color:#d6aaa0;border-color:rgba(214,170,160,.35)}
.zq-submit{grid-column:1/-1;display:flex;justify-content:flex-start}
@media(max-width:760px){
  .zq-form{grid-template-columns:1fr}
  .zq-field.full,.zq-consent,.zq-status,.zq-submit{grid-column:auto}
  .personalization-request{margin-top:65px}
}
</style>
