<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>E-mail confirmado | ZAVQEL</title>

    <meta name="description" content="Seu e-mail foi confirmado. Você agora faz parte do pré-lançamento ZAVQEL.">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #050505;
            color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .container {
            width: 100%;
            max-width: 680px;
            text-align: center;
        }

        .monogram {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 48px;
            letter-spacing: 8px;
            color: #c9a96a;
            margin-bottom: 55px;
        }

        .check {
            width: 72px;
            height: 72px;
            border: 1px solid #c9a96a;
            border-radius: 50%;
            margin: 0 auto 35px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #c9a96a;
            font-size: 30px;
        }

        .line {
            width: 55px;
            height: 1px;
            background: #c9a96a;
            margin: 0 auto 35px;
        }

        h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(32px, 7vw, 56px);
            font-weight: normal;
            letter-spacing: 4px;
            margin-bottom: 25px;
        }

        .subtitle {
            font-size: 16px;
            line-height: 1.8;
            color: #cfcfcf;
            max-width: 540px;
            margin: 0 auto 20px;
        }

        .highlight {
            color: #c9a96a;
        }

        .message {
            margin-top: 35px;
            padding: 25px;
            border-top: 1px solid #222;
            border-bottom: 1px solid #222;
        }

        .message p {
            color: #999;
            font-size: 14px;
            line-height: 1.8;
        }

        .button {
            display: inline-block;
            margin-top: 35px;
            padding: 15px 34px;

            background: #c9a96a;
            color: #050505;

            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;

            transition: all 0.3s ease;
        }

        .button:hover {
            background: #e0c48a;
        }

        .footer {
            margin-top: 65px;
            font-size: 11px;
            letter-spacing: 3px;
            color: #555;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .monogram {
                margin-bottom: 40px;
                font-size: 40px;
            }

            .check {
                width: 64px;
                height: 64px;
            }

            .subtitle {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="monogram">ZAVQEL</div>

        <div class="check">✓</div>

        <div class="line"></div>

        <h1>VOCÊ ESTÁ DENTRO.</h1>

        <p class="subtitle">
            Seu e-mail foi
            <span class="highlight">confirmado com sucesso.</span>
        </p>

        <div class="message">
            <p>
                Agora você faz parte do
                <span class="highlight">pré-lançamento ZAVQEL</span>.
            </p>

            <p>
                Prepare-se para descobrir uma nova expressão
                de identidade, exclusividade e personalidade.
            </p>
        </div>

        <a href="/" class="button">
            Conhecer ZAVQEL
        </a>

        <div class="footer">
            Maison de Fragrâncias
        </div>

    </main>

</body>
</html>
